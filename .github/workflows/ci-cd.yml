# Pipeline CI/CD (E24)
#
#   push / PR ──► 1. Backend : install, lint, format, tests (MongoDB), audit
#             └─► 2. Frontend : install, lint, format, tests, build, audit
#   push/manuel ► 3. Images Docker : build + push sur GHCR (tag sha-xxxxxxx) + scan Trivy
#   develop   ──► 4. Déploiement PRÉ-PRODUCTION (automatique)
#   main      ──► 5. Déploiement PRODUCTION (après approbation manuelle de l'environnement "production")
#
# Les déploiements ne s'exécutent que si la variable de dépôt DEPLOY_ENABLED vaut "true".
# Cible choisie par DEPLOY_TARGET : "render" (PaaS gratuit, retenu) ou "vps" (Docker Compose + SSH).
name: CI/CD

on:
  push:
    branches: [main, develop]
    # Une modification de documentation seule ne relance ni build ni déploiement.
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/tasks_test
      - name: Audit des dépendances (bloquant si faille haute ou critique)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Audit des dépendances (bloquant si faille haute ou critique)
        run: npm audit --audit-level=high

  images:
    name: Images Docker (build, push, scan)
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        name: Calcul des tags
        run: |
          {
            echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "tag=sha-${GITHUB_SHA::7}"
            if [ "$GITHUB_REF_NAME" = "main" ]; then echo "channel=prod"; else echo "channel=preprod"; fi
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/tasks-backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/tasks-backend:${{ steps.meta.outputs.channel }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/tasks-frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/tasks-frontend:${{ steps.meta.outputs.channel }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Scan de vulnérabilités des images (Trivy, bloquant si CRITICAL)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rc=0
          for img in tasks-backend tasks-frontend; do
            ref="${{ steps.meta.outputs.prefix }}/$img:${{ steps.meta.outputs.tag }}"
            # Rapport HIGH + CRITICAL (informatif)
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:latest image \
              --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$ref"
            # Barrière de sécurité : échec si une faille CRITIQUE corrigeable subsiste
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:latest image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress -q "$ref" || rc=1
          done
          exit "$rc"

  deploy-preprod:
    name: Déploiement pré-production
    needs: images
    if: github.ref == 'refs/heads/develop' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preprod
      tag: ${{ needs.images.outputs.tag }}
      url: ${{ vars.PREPROD_URL }}
      target: ${{ vars.DEPLOY_TARGET || 'vps' }}
    secrets: inherit
    permissions:
      contents: read
      packages: read

  deploy-prod:
    name: Déploiement production
    needs: images
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      tag: ${{ needs.images.outputs.tag }}
      url: ${{ vars.PROD_URL }}
      target: ${{ vars.DEPLOY_TARGET || 'vps' }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
