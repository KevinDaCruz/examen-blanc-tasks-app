# Workflow réutilisable : déploie une version sur un environnement (preprod / production).
#
# Deux cibles, choisies par la variable de dépôt DEPLOY_TARGET :
#
#  - render (PaaS, offre gratuite) : déclenche via l'API Render le déploiement du commit testé
#    sur l'API puis sur le site, attend l'état "live" puis fait un test de fumée.
#      secret  RENDER_API_KEY                       (dépôt)
#      vars    RENDER_API_SERVICE_ID, RENDER_WEB_SERVICE_ID (par environnement GitHub)
#
#  - vps : copie les fichiers via SSH et lance deploy.sh (images GHCR, healthchecks, rollback).
#      secrets SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS (par environnement GitHub)
name: Deploy

on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      tag: { required: true, type: string }
      url: { required: true, type: string }
      target: { required: false, type: string, default: vps }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: /opt/tasks-app
      TARGET: ${{ inputs.environment == 'production' && 'prod' || 'preprod' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configuration SSH
        if: inputs.target == 'vps'
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Copie des fichiers de déploiement
        if: inputs.target == 'vps'
        run: |
          rsync -az --delete-after \
            --filter='P .env*' --filter='P .deployed-*' --filter='P deployments.log' --filter='P backups/' \
            --filter='P infra/proxy/.env' --filter='P infra/monitoring/.env' \
            --filter='P infra/monitoring/prometheus/targets/*.yml' \
            --include='docker-compose.yml' --include='deploy.sh' \
            --include='docker/***' --include='infra/***' --exclude='*' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${APP_DIR}/"

      - name: Déploiement (pull + up + healthcheck + rollback auto)
        if: inputs.target == 'vps'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          TAG: ${{ inputs.tag }}
        run: |
          # Le token GHCR transite par stdin (jamais dans la ligne de commande visible via ps).
          echo "$GHCR_TOKEN" | ssh "$SSH_TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          rc=0
          # shellcheck disable=SC2029 # variables volontairement développées côté runner
          ssh "$SSH_TARGET" "cd ${APP_DIR} && ./deploy.sh ${TARGET} ${TAG}" || rc=$?
          ssh "$SSH_TARGET" "docker logout ghcr.io >/dev/null" || true
          exit "$rc"

      - name: Déploiement Render (API puis site, commit testé)
        if: inputs.target == 'render'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          API_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          WEB_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy() { # $1 = id du service Render, $2 = libellé
            local id
            id=$(curl -fsS -X POST "https://api.render.com/v1/services/$1/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
              -d "{\"commitId\":\"$COMMIT\",\"clearCache\":\"do_not_clear\"}" | jq -r '.id')
            echo "$2 : déploiement $id du commit ${COMMIT::7}"
            for _ in $(seq 1 90); do
              status=$(curl -fsS "https://api.render.com/v1/services/$1/deploys/$id" \
                -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
              case "$status" in
                live) echo "$2 : en ligne"; return 0 ;;
                build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                  echo "::error::$2 : échec du déploiement ($status)"; return 1 ;;
              esac
              sleep 10
            done
            echo "::error::$2 : délai dépassé"; return 1
          }
          deploy "$API_ID" "API"
          deploy "$WEB_ID" "Site"

      - name: Test de fumée HTTPS
        run: |
          # Plusieurs tentatives : une instance gratuite endormie met environ 1 minute à démarrer.
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors --max-time 60 "${{ inputs.url }}/api/health"
