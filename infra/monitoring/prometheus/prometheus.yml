# Configuration Prometheus : collecte des métriques des deux environnements.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Métriques applicatives exposées par l'API (/metrics, non publique).
  - job_name: tasks-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-prod:5000"]
        labels: { env: prod }
      - targets: ["backend-preprod:5000"]
        labels: { env: preprod }

  # Sondes externes HTTPS (vue utilisateur : DNS + TLS + proxy + nginx + API + MongoDB).
  # Les URL sont propres au serveur : fichier targets/blackbox.yml (copier blackbox.yml.example).
  - job_name: blackbox-health
    metrics_path: /probe
    params: { module: [http_health] }
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
